icon: assets/questpdf-logo.png
summary: QuestPDF Companion
vendor: QuestPDF
license: MIT
url: https://www.questpdf.com

# The app bundles its Flutter engine and plugin libraries in lib/. rpm only adds
# Provides for executable files, so without this the package requires them from the system.
spec_macros:
  - '%global __requires_exclude ^lib(flutter_linux_gtk|.*_plugin)\.so.*$'

# Flutter loads EGL and OpenGL ES at runtime, so rpm can't detect them.
requires:
  - libEGL.so.1()(64bit)
  - libGLESv2.so.2()(64bit)

display_name: QuestPDF Companion

keywords:
  - quest
  - pdf
  - companion

generic_name: QuestPDF Companion

categories:
  - Development

startup_notify: true

postinstall_scripts:
  - ln -sf %{_datadir}/%{name}/questpdf_companion %{_bindir}/questpdf-companion
postuninstall_scripts:
  - '[ $1 -eq 0 ] && rm -f %{_bindir}/questpdf-companion || :'
